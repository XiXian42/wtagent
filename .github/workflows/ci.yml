name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 20.17.0
          - lts/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Test suite
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run

      - name: Create package tarball
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $json = npm pack --json --ignore-scripts | ConvertFrom-Json
          $filename = $json[-1].filename
          "WTAGENT_PACKED_TGZ=$filename" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Packed global install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: node --test test/windows-package-smoke.test.js
        env:
          WTAGENT_PACKED_TGZ: ${{ env.WTAGENT_PACKED_TGZ }}
