name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 20.17.0
          - lts/*

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Test suite
        if: runner.os != 'Windows'
        run: npm test

      - name: Test suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath test-output.log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $matches = Select-String -Path test-output.log -Pattern '^(not ok|✖)|AssertionError|Error:' -Context 2,25
            $detailLines = foreach ($match in $matches) {
              $match.Context.PreContext
              $match.Line
              $match.Context.PostContext
            }
            if ($detailLines.Count -eq 0) {
              $detailLines = Get-Content test-output.log -Tail 80
            }
            $details = ($detailLines | Select-Object -First 100) -join "`n"
            $escaped = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows test failure::$escaped"
            exit $testExitCode
          }

      - name: Package dry run
        run: npm pack --dry-run

      - name: Create package tarball
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $json = npm pack --json --ignore-scripts | ConvertFrom-Json
          $filename = $json[-1].filename
          "WTAGENT_PACKED_TGZ=$filename" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Packed global install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: node --test test/windows-package-smoke.test.js
        env:
          WTAGENT_PACKED_TGZ: ${{ env.WTAGENT_PACKED_TGZ }}
