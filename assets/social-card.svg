<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">WTAgent — ChatGPT, Claude, DeepSeek, Gemini, Grok, Kimi and GLM for local coding</title><rect width="1200" height="630" fill="#f7f8fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="62" font-size="32" fill="#6146dc" font-weight="750" xml:space="preserve">WTAgent</text><text x="887" y="62" font-size="23" fill="#566176" font-weight="650" xml:space="preserve">OPEN SOURCE · MIT</text><text x="64" y="151" font-size="68" fill="#182033" font-weight="750" xml:space="preserve">Turn web chats into</text><text x="64" y="235" font-size="78" fill="#6146dc" font-weight="750" xml:space="preserve">coding agents.</text><text x="64" y="310" font-size="32" fill="#182033" font-weight="650" xml:space="preserve">Turn ChatGPT Web into a Codex-style coding agent.</text><text x="64" y="367" font-size="32" fill="#182033" font-weight="650" xml:space="preserve">Turn Claude Web into a Claude Code-style coding agent.</text><rect x="64" y="397" width="1072" height="103" rx="22" fill="#eeeafb" stroke="#ddd5f4"/><text x="86" y="433" font-size="23" fill="#6146dc" font-weight="700" xml:space="preserve">ALSO SUPPORTS</text><text x="86" y="477" font-size="34" fill="#6146dc" font-weight="700" xml:space="preserve">DeepSeek · Gemini · Grok · Kimi · GLM</text><text x="64" y="549" font-size="28" fill="#566176" font-weight="650" xml:space="preserve">Read files · Edit code · Run tests · No API key</text><text x="64" y="601" font-size="24" fill="#566176" font-weight="500" xml:space="preserve">Independent CLI. Not an official Codex or Claude Code client.</text></g></svg>